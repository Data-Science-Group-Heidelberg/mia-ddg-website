<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Platzhalter bis zum Livegang; wird mit dem Merge der Inhalte wieder entfernt -->
<meta name="robots" content="noindex, nofollow">
<title>MiA DDG · Bald online</title>
<meta name="description" content="MiA DDG – KI-gestützter Diabetes-Chatbot auf Basis der DDG-Leitlinien und Praxisempfehlungen. Die Projektwebsite ist bald online.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#253764">
<style>
@font-face { font-family: "Quicksand"; src: url("/fonts/quicksand-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; src: url("/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
:root {
  --navy: #253764; --orange: #f08a00; --sky: #d2e3f3; --paper: #ffffff; --ink: #18223d; --muted: #4e5a72;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --navy: #a9bdf0; --orange: #f5a032; --sky: #1c2a47; --paper: #0e1527; --ink: #e8edf6; --muted: #a6b1c6; }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
  padding: 2rem clamp(1.25rem, 7vw, 7rem);
  background: var(--paper); color: var(--ink);
  font: 400 1.125rem/1.6 "Atkinson Hyperlegible", system-ui, sans-serif;
}
main { width: min(34rem, 100%); display: grid; gap: 1.5rem; }
.brand { display: flex; align-items: center; gap: 0.9rem; }
.mark { height: 4rem; width: auto; flex: none; }
.mark-ring { stroke: var(--navy); }
.mark-bubbles { fill: var(--orange); }
.brand-name { font: 700 2.25rem/1 "Quicksand", system-ui, sans-serif; color: var(--navy); margin: 0; }
.brand-name b { color: var(--orange); }
.brand-sub { font: 500 1rem/1.2 "Quicksand", system-ui, sans-serif; color: var(--muted); margin: 0.3rem 0 0; }
.tag {
  justify-self: start; font: 700 0.95rem/1 "Quicksand", system-ui, sans-serif;
  background: var(--sky); color: var(--navy); padding: 0.5rem 0.9rem; border-radius: 999px 999px 999px 4px;
}
p { margin: 0; }
.muted { color: var(--muted); }
a { color: var(--navy); text-underline-offset: 0.2em; }
a:hover { text-decoration-thickness: 2px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg class="mark" viewBox="6 12 88 85" aria-hidden="true" focusable="false">
      <circle class="mark-ring" cx="50" cy="50" r="26" fill="none" stroke-width="5"/>
      <g class="mark-bubbles"><rect x="8" y="14" width="40" height="28" rx="6"/><polygon points="29,41 40,41 40,51"/><rect x="52" y="58" width="40" height="28" rx="6"/><polygon points="71,85 60,85 60,95"/></g>
    </svg>
    <div>
      <h1 class="brand-name">MiA <b>DDG</b></h1>
      <p class="brand-sub">My interactive Assistant</p>
    </div>
  </div>
  <span class="tag">Bald online</span>
  <p>MiA DDG ist ein KI-gestützter Chatbot, der Fragen rund um Diabetes auf Grundlage der Leitlinien und Praxisempfehlungen der Deutschen Diabetes Gesellschaft beantwortet. Hier entsteht die Website zum Projekt und zur Studie.</p>
  <p class="muted">Kontakt: <a href="mailto:info@mia-ddg.de">info@mia-ddg.de</a></p>
</main>
</body>
</html>
